name: CI

# L0/L1 gates off-host (spec §17; plan Task 11 item 3, controller ruling).
# Mirrors .claude/test-gate.sh exactly (with WARDEN_SKIP_SPIKES=1 — see the
# "versions" and "gate" steps below and spikes-audit job), plus the clippy
# arithmetic gate and the L9 supply-chain gate (scripts/supply-chain-gate.sh),
# and uploads the built .so + its sha256 for docs/security/RELEASE-INTEGRITY.md
# bookkeeping — only after every gate has passed, never from a possibly-stale
# cache restore.
#
# UNVERIFIED: this workflow has not been executed by GitHub Actions as of
# authoring (Task 11 is tooling/docs only — no push has happened yet). It is
# validated locally only via `python3 -c "import yaml,sys; yaml.safe_load(...)"`.
# See the Task 11 fix report for the exact validation command run.

on:
  push:
    branches:
      - main
      - "phase*"
  pull_request:
    branches:
      - main
      - "phase*"

# Cancel superseded runs on the same ref so pushes to a fast-moving phase
# branch don't queue up redundant Rust builds.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned versions — must match docs/TOOLCHAIN.md exactly. Update both
  # together; a drift between this file and TOOLCHAIN.md is itself an L9 gap.
  # The "versions" step below FAILS the build if any installed tool's
  # reported version string doesn't contain its pin, rather than trusting
  # the install steps silently did the right thing.
  RUST_TOOLCHAIN: "1.97.1"
  SOLANA_CLI_VERSION: "3.1.10"
  ANCHOR_CLI_VERSION: "1.1.2"
  # avm itself is installed from a pinned git tag, not HEAD — resolved
  # 2026-08-19 via `git ls-remote --tags https://github.com/coral-xyz/anchor`
  # to `refs/tags/v1.1.2` -> commit 24035e2b0035c87e321acc1c05f97793829a87f1
  # (peeled). Pinning the tag (not just the version avm installs) closes the
  # gap where `avm` itself — the tool that fetches Anchor — was previously
  # built from whatever HEAD happened to be on push day.
  AVM_GIT_TAG: "v1.1.2"
  CARGO_DENY_VERSION: "0.20.2"
  NODE_VERSION: "22.23.2"
  PNPM_VERSION: "11.12.0"

jobs:
  build-test-gate:
    name: build + test-gate (L0/L1) + supply-chain gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the review-ledger provenance tests (AT-SHA evidence,
          # remediation fix->gate ancestry) resolve historical commits; a depth-one
          # checkout would make them skip (WRDF-0084). Load-bearing in CI now.

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      # target/deploy (the SBF .so + IDL) is deliberately NOT cached: it must
      # be produced fresh by this run's build step so the artifact uploaded
      # below is provably what this run built, never a stale carry-over from
      # a previous cache. target/debug (the host-side test build, which is
      # the expensive part — full Agave runtime + openssl-sys from source)
      # IS cached, since caching it cannot cause a stale-artifact problem.
      - name: Cache cargo registry + git + host build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ env.SOLANA_CLI_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ env.SOLANA_CLI_VERSION }}-

      - name: Cache ~/.cargo/bin tools (cargo-deny, avm, anchor-cli)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.avm
          key: ${{ runner.os }}-cargo-bin-deny${{ env.CARGO_DENY_VERSION }}-avm${{ env.AVM_GIT_TAG }}-anchor${{ env.ANCHOR_CLI_VERSION }}

      - name: Install Solana CLI (Agave) — pinned via the official installer
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_CLI_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deny — pinned exact version
        run: |
          if command -v cargo-deny >/dev/null 2>&1 && cargo-deny --version | grep -q "${{ env.CARGO_DENY_VERSION }}"; then
            echo "cargo-deny ${{ env.CARGO_DENY_VERSION }} already present (cache hit)"
          else
            cargo install cargo-deny --version ${{ env.CARGO_DENY_VERSION }} --locked
          fi

      - name: Install avm (pinned git tag) + Anchor CLI — pinned
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
          if ! command -v avm >/dev/null 2>&1; then
            cargo install --git https://github.com/coral-xyz/anchor avm --tag ${{ env.AVM_GIT_TAG }} --locked --force
          fi
          if ! (command -v anchor >/dev/null 2>&1 && anchor --version | grep -q "${{ env.ANCHOR_CLI_VERSION }}"); then
            avm install ${{ env.ANCHOR_CLI_VERSION }}
          fi
          avm use ${{ env.ANCHOR_CLI_VERSION }}
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the shipped extension browser gate
        run: pnpm --filter @warden/extension exec playwright install --with-deps chromium

      # Fails the build (not just warns) on ANY pinned-version mismatch —
      # every tool that install steps above claim to have set up is
      # verified here by parsing its own --version output, not trusted
      # because the install step exited 0.
      - name: Assert pinned versions (rustc / solana / anchor / node / pnpm)
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" expected="$2" actual="$3"
            if ! echo "$actual" | grep -qF "$expected"; then
              echo "VERSION MISMATCH: $name — expected to contain '$expected', got: $actual" >&2
              fail=1
            else
              echo "OK: $name -> $actual"
            fi
          }
          check "rustc"  "${{ env.RUST_TOOLCHAIN }}"    "$(rustc --version)"
          check "solana" "${{ env.SOLANA_CLI_VERSION }}" "$(solana --version)"
          check "anchor" "${{ env.ANCHOR_CLI_VERSION }}" "$(anchor --version)"
          check "node"   "v${{ env.NODE_VERSION }}"      "$(node --version)"
          check "pnpm"   "${{ env.PNPM_VERSION }}"       "$(pnpm --version)"
          if [ "$fail" -ne 0 ]; then
            echo "One or more toolchain versions do not match docs/TOOLCHAIN.md's pins — refusing to continue." >&2
            exit 1
          fi

      # WARDEN_SKIP_SPIKES=1 excludes throwaway spike packages only; the shipped
      # extension's mandatory Chromium lane still runs inside test-gate below.
      # The spikes-audit job covers spikes separately and non-blockingly. Builds
      # warden.so fresh every run (target/deploy is never cached — see above),
      # then runs the L0 sigverify suite + full cargo test --workspace.
      - name: Run .claude/test-gate.sh (builds warden.so, runs L0 sigverify + full suite; spikes skipped here)
        env:
          WARDEN_SKIP_SPIKES: "1"
        run: ./.claude/test-gate.sh

      # C6: this is deliberately separate from the developer test gate because
      # release packaging refuses dirty source trees. It rebuilds the extension,
      # emits the normalized unpacked tree and canonical Web Store upload ZIP,
      # verifies every payload hash/policy field, and asks Info-ZIP to parse the
      # archive independently. It does not publish or contact the Web Store.
      - name: C6 deterministic extension upload-package gate
        run: pnpm --filter @warden/extension release:gate

      - name: cargo clippy -p warden — deny arithmetic side effects
        run: cargo clippy -p warden --lib -- -D clippy::arithmetic_side_effects

      - name: L9 supply-chain gate (cargo-deny --locked check + pnpm audit)
        run: ./scripts/supply-chain-gate.sh

      # WRDF-0063: the test-gate builds warden.so WITH `--features test-jup`
      # (swap → the mock), so that binary must NEVER be published as the
      # release artifact. Rebuild a clean PRODUCTION warden.so — default
      # features only — into an ISOLATED path, and upload only that. The
      # production build is what pins the real Jupiter v6 id
      # (swap::tests::swap_target_program_is_pinned covers the non-feature
      # branch; a feature-flag grep here is a cheap artifact-provenance guard).
      - name: Attest the PRODUCTION swap pin (DEFAULT features — the published profile)
        # WRDF-0068: a `strings` grep is not a provenance guard — SWAP_TARGET_
        # PROGRAM is `from_str_const`-evaluated to key bytes, so the printable
        # base58 need not survive in the ELF. Run the pin test under the SAME
        # feature profile the published `.so` is built with (DEFAULT features:
        # `custom-heap` on, `test-jup` OFF — NOT `--no-default-features`, which
        # would drop custom-heap and attest a different profile than ships). It
        # executes swap's `not(test-jup)` branch and asserts SWAP_TARGET_PROGRAM
        # == the real Jupiter v6 id, so the attestation matches the production
        # build below.
        run: cargo test -p warden --lib swap_target_program_is_pinned

      - name: Build the PRODUCTION warden.so (no test-jup) into an isolated dir
        run: |
          rm -rf target/deploy-release
          cargo-build-sbf --manifest-path programs/warden/Cargo.toml \
            --sbf-out-dir target/deploy-release
          test -f target/deploy-release/warden.so || { echo "production warden.so missing" >&2; exit 1; }

      - name: Compute production warden.so sha256
        run: sha256sum target/deploy-release/warden.so | tee target/deploy-release/warden.so.sha256

      - name: Upload PRODUCTION warden.so + sha256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: warden-so-${{ github.sha }}
          path: |
            target/deploy-release/warden.so
            target/deploy-release/warden.so.sha256
          if-no-files-found: error
          retention-days: 90

  spikes-audit:
    name: spikes audit (non-blocking, Playwright/Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking by controller ruling: spikes are throwaway evidence
    # (CLAUDE.md) and are excluded from both the Rust workspace
    # (Cargo.toml `exclude = ["spikes"]`) and, in the main gate job above,
    # from the pnpm test run (WARDEN_SKIP_SPIKES=1). This job exists purely
    # to keep spikes/*/ts from silently bit-rotting — a red run here is a
    # signal to look, never a blocker for main/phase-branch CI.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the review-ledger provenance tests (AT-SHA evidence,
          # remediation fix->gate ancestry) resolve historical commits; a depth-one
          # checkout would make them skip (WRDF-0084). Load-bearing in CI now.

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the Playwright spike (spikes/02-webauthn/ts)
        run: pnpm --filter ./spikes/02-webauthn/ts exec playwright install --with-deps chromium

      - name: Run spikes/*/ts tests
        run: pnpm --filter './spikes/**' --if-present test

      # spikes/ advisories (e.g. bigint-buffer via spikes/03-txbudget/ts's
      # Marinade SDK chain) are excluded from the main job's blocking
      # `pnpm audit` (scripts/supply-chain-gate.sh) precisely so they land
      # here instead — non-blocking (`continue-on-error: true` on the whole
      # job), but still visible in CI's run log rather than never audited
      # anywhere.
      - name: Audit spikes/*/ts (non-blocking — informational only)
        run: pnpm audit --audit-level=high || echo "spikes/ advisory(ies) present — non-blocking, see job log above"
