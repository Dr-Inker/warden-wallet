[package]
name = "test-middleman"
license = "MIT"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "test_middleman"

[features]
default = []
# Empty pass-through so `anchor build -- --features test-jup` (which forwards the
# flag to EVERY program) does not error here; only warden's `test-jup` does
# anything (swaps its Jupiter target for the mock). See warden/src/constants.rs.
test-jup = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
