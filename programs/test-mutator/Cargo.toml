[package]
name = "test-mutator"
license = "MIT"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "test_mutator"

[features]
# Same custom-heap arrangement as programs/warden (see warden/src/heap.rs):
# the mutator carries the identical uncapped bump allocator so `heap_hog` can
# PROVE, end to end in LiteSVM, that a RequestHeapFrame-granted region is
# actually usable once the entrypoint's 32 KiB-capped default allocator is out
# of the way — the Task 6 prerequisite evidence.
default = ["custom-heap"]
custom-heap = []
test-jup = []  # pass-through for `anchor build -- --features test-jup`; inert here
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
