[package]
name = "spike-conserve"
version = "0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "3"
# Resolve to 7.0.0 each (`cargo tree`) but are NOT imported by src/lib.rs — see
# the module doc there: their solana-program 2.3.0 Pubkey type is a different,
# non-interconvertible type from the solana-program 3.0.0 Pubkey this crate's
# AccountInfo uses (`cargo tree -i solana-program` reports it ambiguous
# 2.3.0/3.0.0). Kept declared only so the resolved majors are on record.
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-token-2022 = { version = "7", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.12"
solana-sdk = "3"

[features]
no-entrypoint = []
# Selects the TLV-tail hash syscall in src/lib.rs::tlv_hash. Default = keccak.
# See result.md part (b) for the measured keccak-vs-sha256 CU comparison.
sha256-tlv = []

# NOTE (spike 3b): same reasoning as spikes/02-webauthn/onchain/Cargo.toml —
# the repo-root Cargo.toml lists workspace members that do not exist yet, so
# this crate carries its own empty [workspace] table to build standalone.
[workspace]
